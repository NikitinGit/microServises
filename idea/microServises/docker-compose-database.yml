
version: '3.9'
services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: gtngtngtnN5
      MYSQL_DATABASE: service_db1
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pgtngtngtnN5"]
      interval: 5s
      timeout: 5s
      retries: 10

  service1:
    build:
      context: /home/user/idea/service1
      dockerfile: Dockerfile
    container_name: service1
    ports:
      - "8086:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: gtngtngtnN5

volumes:
  mysql_data:
